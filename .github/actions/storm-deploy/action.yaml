name: Storm Deploy
description: Substitute env vars into workflow config, install agent, and run deployment

inputs:
  github_token:
    description: GitHub token for cloning
    required: true
  github_repo:
    description: GitHub repository (owner/repo)
    required: true
  github_ref:
    description: Git branch or tag name
    required: true
  inventory:
    description: Path to Storm inventory file
    required: false
    default: .storm/inventory.yaml
  workflow:
    description: Path to Storm workflow file
    required: false
    default: .storm/workflow.yaml

runs:
  using: composite
  steps:
    - name: Substitute env variables into workflow config
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPO: ${{ inputs.github_repo }}
        GITHUB_REF: ${{ inputs.github_ref }}
      run: |
        envsubst '${GITHUB_TOKEN} ${GITHUB_REPO} ${GITHUB_REF}' < ${{ inputs.workflow }} > .storm/workflow-temp.yaml
        mv .storm/workflow-temp.yaml ${{ inputs.workflow }}

    - name: Install storm agent on remote servers
      shell: bash
      run: storm agent install -i ${{ inputs.inventory }}

    - name: Run storm workflow
      shell: bash
      run: storm agent run -i ${{ inputs.inventory }} ${{ inputs.workflow }}
