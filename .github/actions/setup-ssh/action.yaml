name: Setup SSH
description: Decode SSH key and write it to disk for Storm inventory

inputs:
  ssh_key:
    description: Base64-encoded SSH private key
    required: true
  output_file:
    description: Path to write the decoded key to
    required: false
    default: ./id_rsa

runs:
  using: composite
  steps:
    - name: Write SSH key
      shell: bash
      run: |
        echo "${{ inputs.ssh_key }}" | base64 -d > "${{ inputs.output_file }}"
        chmod 600 "${{ inputs.output_file }}"
