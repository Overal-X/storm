name: deploy
description: Setup SSH, install Storm CLI, and run Storm deployment

inputs:
  ssh_key:
    description: Base64-encoded SSH private key
    required: false
    default: ""
  ssh_output_file:
    description: Path to write the decoded SSH key to
    required: false
    default: ./id_rsa
  github_token:
    description: GitHub token for cloning
    required: true
  github_repo:
    description: GitHub repository (owner/repo)
    required: true
  github_ref:
    description: Git branch or tag name
    required: true
  inventory:
    description: Path to Storm inventory file
    required: false
    default: .storm/inventory.yaml
  workflow:
    description: Path to Storm workflow file
    required: false
    default: .storm/workflow.yaml
  vars:
    description: "Context variables to inject into the workflow"
    required: false
    default: "{}"
  secrets:
    description: "Context secrets to inject into the workflow"
    required: false
    default: "{}"
  github:
    description: "Context github variables to inject into the workflow"
    required: false
    default: "{}"

runs:
  using: composite
  steps:
    - name: Install storm
      shell: bash
      run: |
        curl -fsSL https://raw.githubusercontent.com/Overal-X/storm/main/scripts/install.sh | bash
        echo "$HOME/.storm/bin" >> "$GITHUB_PATH"

    - name: Verify storm
      shell: bash
      run: storm version

    - name: Write SSH key
      if: ${{ inputs.ssh_key != '' }}
      shell: bash
      run: |
        echo "${{ inputs.ssh_key }}" | base64 -d > "${{ inputs.ssh_output_file }}"
        ls -l "${{ inputs.ssh_output_file }}"

    - name: Install storm agent on remote servers
      shell: bash
      run: storm agent install -i ${{ inputs.inventory }}

    - name: Run storm workflow
      shell: bash
      env:
        GITHUB_CONTEXT: ${{ inputs.github }}
        SECRETS_CONTEXT: ${{ inputs.secrets }}
        VARS_CONTEXT: ${{ inputs.vars }}
      run: |
        ARGS=()
        [ -n "$GITHUB_CONTEXT" ] && ARGS+=(--context "github:$(echo "$GITHUB_CONTEXT" | jq -c .)")
        [ -n "$SECRETS_CONTEXT" ] && ARGS+=(--context "secrets:$(echo "$SECRETS_CONTEXT" | jq -c .)")
        [ -n "$VARS_CONTEXT" ] && ARGS+=(--context "vars:$(echo "$VARS_CONTEXT" | jq -c .)")

        storm agent run "${ARGS[@]}" -i ${{ inputs.inventory }} ${{ inputs.workflow }}
