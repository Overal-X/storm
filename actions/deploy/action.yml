name: deploy
description: Setup SSH, install Storm CLI, and run Storm deployment

inputs:
  ssh_key:
    description: Base64-encoded SSH private key
    required: false
    default: ""
  ssh_output_file:
    description: Path to write the decoded SSH key to
    required: false
    default: ./id_rsa
  github_token:
    description: GitHub token for cloning
    required: true
  github_repo:
    description: GitHub repository (owner/repo)
    required: true
  github_ref:
    description: Git branch or tag name
    required: true
  inventory:
    description: Path to Storm inventory file
    required: false
    default: .storm/inventory.yaml
  workflow:
    description: Path to Storm workflow file
    required: false
    default: .storm/workflow.yaml
  vars_context:
    description: "Context variables to inject into the workflow in base64 format"
    required: false
    default: ""
  secrets_context:
    description: "Context secrets to inject into the workflow in base64 format"
    required: false
    default: ""
  github_context:
    description: "Context github variables to inject into the workflow in base64 format"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install storm
      shell: bash
      run: |
        curl -fsSL https://raw.githubusercontent.com/Overal-X/storm/main/scripts/install.sh | bash
        echo "$HOME/.storm/bin" >> "$GITHUB_PATH"

    - name: Verify storm
      shell: bash
      run: storm version

    - name: Write SSH key
      if: ${{ inputs.ssh_key != '' }}
      shell: bash
      run: |
        echo "${{ inputs.ssh_key }}" | base64 -d > "${{ inputs.ssh_output_file }}"
        ls -l "${{ inputs.ssh_output_file }}"

    - name: Install storm agent on remote servers
      shell: bash
      run: storm agent install -i ${{ inputs.inventory }}

    - name: Run storm workflow
      shell: bash
      env:
        GITHUB_CONTEXT: ${{ inputs.github_context }}
        SECRETS_CONTEXT: ${{ inputs.secrets_context }}
        VARS_CONTEXT: ${{ inputs.vars_context }}
      run: |
        # ARGS=()
        # EMPTY_JSON=$(echo '{}' | base64 -w 0)  # = e30K

        # [ -n "$GITHUB_CONTEXT" ] && [ "$GITHUB_CONTEXT" != "$EMPTY_JSON" ] && ARGS+=(--context "github:$GITHUB_CONTEXT")
        # [ -n "$SECRETS_CONTEXT" ] && [ "$SECRETS_CONTEXT" != "$EMPTY_JSON" ] && ARGS+=(--context "secrets:$SECRETS_CONTEXT")
        # [ -n "$VARS_CONTEXT" ] && [ "$VARS_CONTEXT" != "$EMPTY_JSON" ] && ARGS+=(--context "vars:$VARS_CONTEXT")

        # storm agent run --context-format=base64 "${ARGS[@]}" -i ${{ inputs.inventory }} ${{ inputs.workflow }}

        storm agent run \
          --context-format=base64 \
          --context="github:$GITHUB_CONTEXT" \
          --context="secrets:$SECRETS_CONTEXT" \
          -i ${{ inputs.inventory }} ${{ inputs.workflow }}
